name: JET Gold Intelligence

on:
  schedule:
    - cron: "*/5 6-20 * * 1-5"
    - cron: "15 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jet-gold
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyse Gold
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_STARS: "4"
        run: python gold_bot.py
      - name: Sauvegarder l'état et le rapport
        run: |
          git config user.name "jet-gold"
          git config user.email "jet-gold@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || (git commit -m "maj" && git pull --rebase -q && git push)
